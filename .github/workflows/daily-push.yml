name: NEMAA Daily Blessing Push Notification

# وضعان (يُحدَّدان بمتغيّر المستودع PUSH_MODE، وإن لم يوجد فالوضع broadcast):
#   broadcast : إشعار واحد للجميع الساعة 06:00 UTC (09:00 صباحاً بتوقيت القاهرة صيفاً أو 08:00 شتاءً).
#   slots     : يحترم الوقت الذي اختاره كل مستخدم بتوقيته المحلي (يعمل 00:30 UTC).
# السكربت نفسه يتجاهل الجدول غير المطابق للوضع الحالي، فلا يُرسل شيء مرتين.

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '30 0 * * *'
  # تشغيل يدوي من تبويب Actions. dry_run=true يطبع ما كان سيُرسل دون إرسال أي شيء.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'تجربة بدون إرسال فعلي (true/false)'
        required: false
        default: 'true'

permissions:
  contents: read

concurrency:
  group: nemaa-daily-push
  cancel-in-progress: false

jobs:
  send-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Send Daily Blessing Push via OneSignal
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          PUSH_MODE: ${{ vars.PUSH_MODE }}
          SCHEDULE: ${{ github.event.schedule }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || '' }}
        run: node scripts/send-daily-push.mjs
